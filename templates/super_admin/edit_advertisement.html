{% extends "base.html" %}
{% block title %}Edit Advertisement - SchoolBridge{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="mb-1">Edit Advertisement</h4>
        <p class="text-muted mb-0">This will appear on the login page banner.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-megaphone"></i> Advertisement Details</h5></div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('super_admin_edit_advertisement', id=ad.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" name="title" value="{{ ad.title }}" required placeholder="e.g. Trip to Chinhoyi Caves">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Body</label>
                        <textarea class="form-control" name="body" rows="4" placeholder="Short advertisement text shown on the login page">{{ ad.body or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image URL (optional)</label>
                        <input type="url" class="form-control" name="image_url" value="{{ ad.image_url or '' }}" placeholder="https://example.com/banner.jpg">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="is_active" id="is_active" {{ 'checked' if ad.is_active else '' }}>
                        <label class="form-check-label" for="is_active">Active (visible on login page)</label>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
                    <a href="{{ url_for('super_admin_advertisements') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
