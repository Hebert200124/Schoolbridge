{% extends "base.html" %}
{% block title %}Verify OTP - SchoolBridge{% endblock %}
{% block content %}
<div class="login-container">
    <div class="card login-card">
        <div class="login-header">
            <h2><i class="bi bi-shield-lock"></i> Verify OTP</h2>
            <p class="mb-0 opacity-75">Enter the 6-digit code sent to your email</p>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('auth_reset_code') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">One-Time Password (OTP)</label>
                    <input type="text" class="form-control text-center fs-4 fw-bold" name="code" required
                           placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]{6}"
                           autocomplete="one-time-code">
                    <div class="form-text text-center">Enter the 6-digit code sent via email. It expires in 10 minutes.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle"></i> Verify OTP</button>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <a href="{{ url_for('auth_reset_email') }}" class="btn btn-outline-secondary w-100"><i class="bi bi-arrow-counterclockwise"></i> Resend OTP</a>
            </div>
            <div class="text-center mt-2">
                <a href="{{ url_for('auth_login') }}"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
