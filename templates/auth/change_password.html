{% extends "base.html" %}
{% block title %}Change Password - SchoolBridge{% endblock %}
{% block content %}
<div class="login-container">
    <div class="card login-card">
        <div class="login-header">
            <h2><i class="bi bi-lock"></i> Change Password</h2>
            <p class="mb-0 opacity-75">{{ current_user.full_name }}</p>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="current_password" id="cp-current" required placeholder="Enter your current password">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('cp-current')" tabindex="-1">
                            <i class="bi bi-eye" id="cp-current-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="new_password" id="cp-new" required placeholder="At least 6 characters" minlength="6">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('cp-new')" tabindex="-1">
                            <i class="bi bi-eye" id="cp-new-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="confirm_password" id="cp-confirm" required placeholder="Repeat your new password" minlength="6">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('cp-confirm')" tabindex="-1">
                            <i class="bi bi-eye" id="cp-confirm-icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle"></i> Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
