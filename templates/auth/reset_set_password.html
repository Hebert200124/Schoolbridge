{% extends "base.html" %}
{% block title %}Set New Password - SchoolBridge{% endblock %}
{% block content %}
<div class="login-container">
    <div class="card login-card">
        <div class="login-header">
            <h2><i class="bi bi-lock"></i> Set New Password</h2>
            <p class="mb-0 opacity-75">Enter your new password</p>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="new_password" id="rsp-new" required placeholder="At least 6 characters" minlength="6">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('rsp-new')" tabindex="-1">
                            <i class="bi bi-eye" id="rsp-new-icon"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="confirm_password" id="rsp-confirm" required placeholder="Repeat your new password" minlength="6">
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('rsp-confirm')" tabindex="-1">
                            <i class="bi bi-eye" id="rsp-confirm-icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle"></i> Save Password</button>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <a href="{{ url_for('auth_reset_password') }}"><i class="bi bi-arrow-left"></i> Start Over</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
