{% extends "base.html" %}
{% block title %}Reset Password - SchoolBridge{% endblock %}
{% block content %}
<div class="login-container">
    <div class="card login-card">
        <div class="login-header">
            <h2><i class="bi bi-key"></i> Reset Password</h2>
            <p class="mb-0 opacity-75">Step 1 of 3 - Enter your registration number</p>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('auth_reset_password') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Registration Number</label>
                    <input type="text" class="form-control" name="reg_number" required placeholder="e.g. REG-2026001" autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-arrow-right"></i> Continue</button>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <a href="{{ url_for('auth_login') }}"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
