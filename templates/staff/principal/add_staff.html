{% extends "base.html" %}
{% block title %}Add Staff - SchoolBridge{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-person-plus"></i> Add New Staff Member</h5></div>
            <div class="card-body">
                <form method="POST">
                    {% if campuses %}
                    <div class="mb-3">
                        <label class="form-label">Campus</label>
                        <select class="form-select" name="campus_id" required>
                            {% for c in campuses %}
                            <option value="{{ c.id }}">{{ c.name }} ({{ c.code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Role</label>
                            <select class="form-select" name="role" id="staffRole" required>
                                <option value="teacher">Teacher</option>
                                <option value="cashier">Cashier</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3" id="subjectGroup">
                            <label class="form-label">Subject</label>
                            <select class="form-select" name="subject_id">
                                <option value="">-- Select Subject --</option>
                                {% for subject in subjects %}
                                <option value="{{ subject.id }}">{{ subject.name }} ({{ subject.level }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Password</label>
                            <input type="text" class="form-control" name="password" required value="password123">
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="on_leave" id="onLeaveToggle">
                        <label class="form-check-label" for="onLeaveToggle">Currently on leave</label>
                    </div>
                    <div id="leaveGroup" style="display:none;">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Leave Type</label>
                                <select class="form-select" name="leave_type">
                                    <option value="Annual">Annual</option>
                                    <option value="Sick">Sick</option>
                                    <option value="Maternity">Maternity</option>
                                    <option value="Study">Study</option>
                                    <option value="Unpaid">Unpaid</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" name="leave_start">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">End Date</label>
                                <input type="date" class="form-control" name="leave_end">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Reason</label>
                            <textarea class="form-control" name="leave_reason" rows="2"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Add Staff Member</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('staffRole').addEventListener('change', function() {
    document.getElementById('subjectGroup').style.display = this.value === 'teacher' ? '' : 'none';
});
document.getElementById('onLeaveToggle').addEventListener('change', function() {
    document.getElementById('leaveGroup').style.display = this.checked ? '' : 'none';
});
</script>
{% endblock %}
