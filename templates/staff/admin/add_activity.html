{% extends "base.html" %}
{% block title %}New Activity - SchoolBridge{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-circle"></i> New Announcement / Activity</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="4"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Visibility</label>
                        <select class="form-select" name="visibility">
                            <option value="all">Everyone (staff &amp; students)</option>
                            <option value="staff">Staff Only</option>
                        </select>
                        <div class="form-text">Staff Only: visible to teachers, principal, cashier. Everyone: visible to all users including students.</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_activities') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Activity</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
