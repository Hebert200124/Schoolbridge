{% extends "base.html" %}
{% block title %}Edit Student - SchoolBridge{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil"></i> Edit: {{ student.full_name }}</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" name="first_name" value="{{ student.first_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" name="last_name" value="{{ student.last_name }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Form</label>
                            <select class="form-select" name="form" required>
                                {% for f in ['Form 1', 'Form 2', 'Form 3', 'Form 4', 'Form 5', 'Form 6'] %}
                                <option value="{{ f }}" {{ 'selected' if student.form == f }}>{{ f }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="{{ student.email or '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone" value="{{ student.phone or '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subjects</label>
                        <div class="row">
                            {% for subject in subjects %}
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="subjects" value="{{ subject.id }}" id="subj{{ subject.id }}" {{ 'checked' if subject.id in enrolled_ids }}>
                                    <label class="form-check-label" for="subj{{ subject.id }}">{{ subject.name }}</label>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password (leave blank to keep current)</label>
                        <input type="text" class="form-control" name="password" placeholder="Leave blank">
                    </div>
                    <p class="text-muted small">Reg Number: {{ student.reg_number or 'N/A' }}</p>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Update Student</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
